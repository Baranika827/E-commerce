<!DOCTYPE html>
<html>
<head>
    <title>Test IDM-VTON API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #4f46e5;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .loading {
            color: #fbbf24;
        }
        .error {
            color: #ef4444;
        }
        .success {
            color: #10b981;
        }
    </style>
</head>
<body>
    <h1>🧪 IDM-VTON API Test</h1>
    <p>This bypasses the webcam and uses known working public images.</p>
    
    <button onclick="testAPI()">🚀 Test Virtual Try-On</button>
    
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="loading">⏳ Testing API with public images...</p>';

            try {
                const response = await fetch('http://localhost:3003/api/test-tryon', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ Success! Virtual try-on generated.</p>
                        <p><strong>Test Mode:</strong> ${data.testMode}</p>
                        <img src="${data.image}" alt="Generated Result">
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">❌ Error: ${data.error}</p>
                        <p>${data.message || ''}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Network Error: ${error.message}</p>
                    <p>Make sure the API server is running on port 3003</p>
                `;
            }
        }
    </script>
</body>
</html>
